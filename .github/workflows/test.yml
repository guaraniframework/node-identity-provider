name: Test Suite

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Install Dependencies
        run: pnpm ci

      - name: Compile Typescript
        run: pnpm run build

      - name: Run Tests
        run: pnpm test --silent
